name: Export OpenArm pinch-fix source

on:
  push:
    branches:
      - fix/openarm-physical-pinch

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Upload complete source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: robobuddy-openarm-pinch-source
          path: .
          include-hidden-files: true
          retention-days: 1
