name: SO-101 Complex Task Workbench

on:
  push:
    branches:
      - codex/so101-complex-lab-tasks-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create source bundle
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            -czf robobuddy-so101-workbench.tar.gz .
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: robobuddy-so101-workbench
          path: robobuddy-so101-workbench.tar.gz
          if-no-files-found: error
          retention-days: 1
