name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build minimal Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp index.html python.html gemini.html python-docs.html site/
          cp -a css js assets site/
          mkdir -p site/simulator/js site/simulator/css
          cp simulator/js/arm-rig-config.js site/simulator/js/
          cp simulator/js/arm-preview-3d.js site/simulator/js/
          cp simulator/js/arm-preview-mesh-data.js site/simulator/js/
          cp simulator/css/arm-preview-3d.css site/simulator/css/
          find site -maxdepth 4 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
