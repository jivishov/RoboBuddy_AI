name: Export Mission Upgrade Workspace

on:
  push:
    branches:
      - mission-upgrades-so101-openarm-20260827

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Package source workspace
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/robobuddy-source.tar.gz"
          tar --exclude=.git -czf "$archive" .
          test -s "$archive"

      - name: Upload source workspace
        uses: actions/upload-artifact@v4
        with:
          name: robobuddy-source-${{ github.sha }}
          path: ${{ runner.temp }}/robobuddy-source.tar.gz
          if-no-files-found: error
          retention-days: 1
