name: Apply and Validate Mission Upgrades

on:
  push:
    branches:
      - mission-upgrades-so101-openarm-20260827

permissions:
  contents: write

concurrency:
  group: mission-upgrades-so101-openarm-20260827
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/mission-upgrade-payload/part-* > "$RUNNER_TEMP/mission.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/mission.patch.gz.b64" > "$RUNNER_TEMP/mission.patch.gz"
          gzip --decompress --stdout "$RUNNER_TEMP/mission.patch.gz" > "$RUNNER_TEMP/mission.patch"
          echo "371bd61d90bc896d7ea78fd1625db6c8237002f935cbc6a63539268ad77d5b4c  $RUNNER_TEMP/mission.patch" | sha256sum --check -
          git apply --check "$RUNNER_TEMP/mission.patch"
          git apply "$RUNNER_TEMP/mission.patch"

      - name: Rebuild mission definitions and browser catalog
        run: npm run upgrade:v2:complex-lab

      - name: Static and scenario validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm run validate:v2

      - name: Focused mission acceptance
        run: npm run test:v2:complex-lab

      - name: SO-101 programmability and family regression
        run: npm run test:v2:so101

      - name: OpenArm family regression
        run: node --test tests/v2/openarm/openarm.test.mjs

      - name: Integrated all-family regression
        run: npm run test:v2:all

      - name: Commit verified mission upgrade
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/mission-upgrade-payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add measured SO-101 missions and OpenArm equipment stack"
          git push origin HEAD:mission-upgrades-so101-openarm-20260827
