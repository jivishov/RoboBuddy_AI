name: Apply and validate complex physical lab tasks

on:
  push:
    branches:
      - feat/complex-physical-lab-tasks
    paths:
      - "scripts/.complex-lab-upgrade.b64.part-*"
      - "scripts/complex-lab-runner.sh"
      - ".github/workflows/complex-lab-apply.yml"

permissions:
  contents: write

concurrency:
  group: complex-physical-lab-tasks
  cancel-in-progress: false

jobs:
  apply-validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply, validate, and commit the complex physical missions
        run: bash scripts/complex-lab-runner.sh
