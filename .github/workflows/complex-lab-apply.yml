name: Apply and validate complex physical lab tasks

on:
  push:
    branches:
      - feat/complex-physical-lab-tasks
    paths:
      - "scripts/.complex-lab-upgrade.b64.part-*"
      - ".github/workflows/complex-lab-apply.yml"

permissions:
  contents: write

concurrency:
  group: complex-physical-lab-tasks
  cancel-in-progress: false

jobs:
  apply-validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct and verify source transformation
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.complex-lab-upgrade.b64.part-* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/upgrade-complex-lab-tasks.mjs
          echo "85ef2cac6078ba2accf3f645880bea8233723cf05abec2321767f8186e8351b6  /tmp/upgrade-complex-lab-tasks.mjs" | sha256sum --check
          node --check /tmp/upgrade-complex-lab-tasks.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/upgrade-complex-lab-tasks.mjs')
          source = path.read_text()
          source = source.replace(
              'const station = fixture.type === \\"configured_visible_bimanual_workcell\\" ? openArmWorkcell(fixture) : null;',
              'const station = stationByFixtureId.get(fixture.id);',
          )
          source = source.replace(
              'this.definition.objects.forEach((definition) => {',
              'this.definition.objects.forEach((item) => {',
          )
          source = source.replace(
              'patchRefinerGuards();',
              '// Current maintenance scripts are guarded directly by the workflow at their actual file-loop boundaries.',
          )
          path.write_text(source)
          PY
          node --check /tmp/upgrade-complex-lab-tasks.mjs

      - name: Apply source transformation
        shell: bash
        run: |
          set -o pipefail
          node /tmp/upgrade-complex-lab-tasks.mjs 2>&1 | tee /tmp/complex-lab-apply.log

      - name: Upload source-application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complex-lab-apply-diagnostics-${{ github.run_attempt }}
          path: /tmp/complex-lab-apply.log
          if-no-files-found: warn
          retention-days: 3

      - name: Preserve bespoke tasks in maintenance refiners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          so101_path = Path('scripts/refine-so101-v2-source.mjs')
          so101 = so101_path.read_text()
          if 'complex-task-preservation-v1' not in so101:
              needle = '''  const definition = JSON.parse(await readFile(sourcePath, "utf8"));
          definition.canonicalModel.sourceRevision = model.source.revision;'''
              replacement = '''  const definition = JSON.parse(await readFile(sourcePath, "utf8"));
          // complex-task-preservation-v1: retain bespoke physical missions and refresh only their stripped client copies.
          if (definition.complexTask?.version) {
            assertScenarioV2(definition, { expectedRobotId: "so101_follower" });
            await writeFile(resolve(OUTPUT, name), `${JSON.stringify(stripValidationForClient(definition), null, 2)}\n`);
            console.log(`${definition.id}: preserved bespoke complex physical mission`);
            continue;
          }
          definition.canonicalModel.sourceRevision = model.source.revision;'''
              if needle not in so101:
                  raise SystemExit('SO-101 maintenance-loop anchor missing')
              so101_path.write_text(so101.replace(needle, replacement, 1))

          openarm_path = Path('scripts/refine-openarm-table-clearance.mjs')
          openarm = openarm_path.read_text()
          if 'complex-task-preservation-v1' not in openarm:
              needle = '''  const definition = refine(JSON.parse(fs.readFileSync(sourcePath, "utf8")));
          assertScenarioV2(definition, { expectedRobotId: "openarm_v2_bimanual" });'''
              replacement = '''  const loadedDefinition = JSON.parse(fs.readFileSync(sourcePath, "utf8"));
          // complex-task-preservation-v1: retain bespoke stacked workcells and refresh only their stripped client copies.
          if (loadedDefinition.complexTask?.version) {
            assertScenarioV2(loadedDefinition, { expectedRobotId: "openarm_v2_bimanual" });
            fs.writeFileSync(path.join(outputDir, name), `${JSON.stringify(stripValidationForClient(loadedDefinition), null, 2)}\n`);
            console.log(`${loadedDefinition.id}: preserved bespoke complex physical mission`);
            continue;
          }
          const definition = refine(loadedDefinition);
          assertScenarioV2(definition, { expectedRobotId: "openarm_v2_bimanual" });'''
              if needle not in openarm:
                  raise SystemExit('OpenArm maintenance-loop anchor missing')
              openarm_path.write_text(openarm.replace(needle, replacement, 1))
          PY

      - name: Check modified JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check lab/v2/scenario-engine.js
          node --check scripts/extract-portable-reference-actions.mjs
          node --check lab/js/objects.js
          node --check scripts/portable-physical-rest-helpers.mjs
          node --check lab/v2/equipment-scene.js
          node --check lab/js/workbench-v2.js
          node --check scripts/refine-so101-v2-source.mjs
          node --check scripts/refine-openarm-table-clearance.mjs
          node --check tests/v2/complex-lab-tasks.test.mjs
          node --check tests/v2/so101/so101-family.test.mjs
          node --check tests/v2/openarm/openarm.test.mjs

      - name: Regenerate physical public reference actions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/extract-portable-reference-actions.mjs --scenario=so101-v2-06-quantitative-transfer
          node scripts/extract-portable-reference-actions.mjs --scenario=so101-v2-08-burette-initial-reading
          node scripts/extract-portable-reference-actions.mjs --scenario=openarm-10-gravimetric-workcell

      - name: Refresh generated scenario catalog
        run: node scripts/generate-lab-v2-catalog.mjs --refresh

      - name: Run focused complex-task acceptance
        run: npm run test:v2:complex-lab

      - name: Run foundation and public Python compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          npm run test:v2:foundation
          npm run test:v2:python-compat
          npm run test:v2:portable-workbench-ux

      - name: Run physical-rest and apparatus regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run test:v2:physical-rest
          npm run test:v2:apparatus-visuals
          npm run test:v2:portable-references

      - name: Run SO-101 and OpenArm family regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run test:v2:so101
          node tests/v2/openarm/openarm.test.mjs
          npm run test:v2:openarm-workbench-regression
          npm run test:v2:openarm-surface-pinch

      - name: Run full 50-scenario replay and schema validation
        shell: bash
        run: |
          set -euo pipefail
          npm run test:v2:all
          npm run validate:v2
          git diff --check

      - name: Remove bootstrap payload and commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/.complex-lab-upgrade.b64.part-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 1
          fi
          git commit -m "feat: add complex physical SO-101 and OpenArm lab tasks"
          git push origin HEAD:feat/complex-physical-lab-tasks
